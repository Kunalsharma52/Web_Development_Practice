<!DOCTYPE html>
<html>
<head>
    <title>Gradient Animation</title>

    <style>
        body {
            margin: 0;
            height: 100vh;

            background: linear-gradient(
                45deg,
                red,
                blue,
                purple,
                orange
            );

            background-size: 400% 400%;

            animation: gradient 6s ease infinite;
        }

        @keyframes gradient {

            0% {
                background-position: 0% 50%;
            }

            50% {
                background-position: 100% 50%;
            }

            100% {
                background-position: 0% 50%;
            }
        }
    </style>
</head>

<body>

</body>
</html>
