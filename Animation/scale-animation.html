<!DOCTYPE html>
<html>
<head>
    <title>Scale Animation</title>

    <style>
        body {
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .box {
            width: 120px;
            height: 120px;
            background: orange;

            animation: zoom 1.5s ease-in-out infinite alternate;
        }

        @keyframes zoom {
            from {
                transform: scale(1);
            }

            to {
                transform: scale(1.5);
            }
        }
    </style>
</head>

<body>

    <div class="box"></div>

</body>
</html>
