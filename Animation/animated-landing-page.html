<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Animated Landing Page</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #0f172a;
            color: white;
            overflow: hidden;
        }

        header {
            height: 80px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 8%;
            animation: slideDown 1s ease;
        }

        .logo {
            font-size: 25px;
            font-weight: bold;
        }

        nav a {
            color: white;
            text-decoration: none;
            margin-left: 30px;
            transition: color 0.3s;
        }

        nav a:hover {
            color: #38bdf8;
        }

        .hero {
            height: calc(100vh - 80px);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 8%;
        }

        .content {
            max-width: 550px;
            animation: slideLeft 1.2s ease;
        }

        .content h1 {
            font-size: 60px;
            margin-bottom: 20px;
        }

        .content h1 span {
            color: #38bdf8;
        }

        .content p {
            font-size: 18px;
            line-height: 1.6;
            color: #cbd5e1;
        }

        .button {
            margin-top: 20px;
            padding: 15px 30px;
            border: none;
            border-radius: 30px;
            background: #38bdf8;
            color: #0f172a;
            font-weight: bold;
            cursor: pointer;
            transition: transform 0.3s;
        }

        .button:hover {
            transform: scale(1.1);
        }

        .circle {
            width: 300px;
            height: 300px;
            border-radius: 50%;
            background: #38bdf8;
            box-shadow: 0 0 80px #38bdf8;
            animation: float 3s ease-in-out infinite;
        }

        @keyframes slideDown {
            from {
                transform: translateY(-100px);
                opacity: 0;
            }

            to {
                transform: translateY(0);
                opacity: 1;
            }
        }

        @keyframes slideLeft {
            from {
                transform: translateX(-100px);
                opacity: 0;
            }

            to {
                transform: translateX(0);
                opacity: 1;
            }
        }

        @keyframes float {
            0%, 100% {
                transform: translateY(0);
            }

            50% {
                transform: translateY(-30px);
            }
        }
    </style>
</head>

<body>

    <header>
        <div class="logo">DevMotion</div>

        <nav>
            <a href="#">Home</a>
            <a href="#">About</a>
            <a href="#">Projects</a>
            <a href="#">Contact</a>
        </nav>
    </header>

    <section class="hero">

        <div class="content">
            <h1>Build <span>Beautiful</span> Websites</h1>

            <p>
                Learn HTML and CSS animations by creating
                interactive and modern web experiences.
            </p>

            <button class="button">Get Started</button>
        </div>

        <div class="circle"></div>

    </section>

</body>
</html>
