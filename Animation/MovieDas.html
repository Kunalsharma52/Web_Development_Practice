<!DOCTYPE html>

    <title>Movie Dashboard</title>

    <style>

        body {
            margin: 20px;
            font-family: Arial;
            background-color: white;
        }

        h1 {
            text-align: center;
        }

        .movies {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 20px;
        }

        .movie {
            border: 1px solid #ddd;
            border-radius: 15px;
            overflow: hidden;
            transition: 0.3s;
        }

        .movie:hover {
            transform: translateY(-8px);
            box-shadow: 0 8px 15px #aaa;
        }

        .movie img {
            width: 100%;
            height: 300px;
            object-fit: cover;
        }

        .details {
            padding: 10px;
        }

        .details h2 {
            margin: 0;
            font-size: 18px;
        }

        .details p {
            color: #555;
        }

        .book {
            padding: 8px 15px;
            background-color: red;
            color: white;
            border: none;
            border-radius: 5px;
        }

        .book:hover {
            background-color: black;
        }

    </style>

</head>
