<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Moving Car</title>

    <style>
        body {
            margin: 0;
            overflow: hidden;
            background: skyblue;
        }

        .road {
            position: absolute;
            bottom: 0;
            width: 100%;
            height: 180px;
            background: #333;
        }

        .car {
            position: absolute;
            bottom: 100px;
            left: -200px;
            font-size: 100px;
            animation: drive 5s linear infinite;
        }

        @keyframes drive {
            from {
                left: -200px;
            }

            to {
                left: 100%;
            }
        }
    </style>
</head>

<body>

    <div class="car">🚗</div>
    <div class="road"></div>

</body>
</html>
