<!DOCTYPE html>
<html>
<head>
    <title>Image Zoom</title>

    <style>
        body {
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .container {
            width: 400px;
            height: 300px;
            overflow: hidden;
        }

        img {
            width: 100%;
            height: 100%;

            object-fit: cover;

            transition: transform 0.6s;
        }

        .container:hover img {
            transform: scale(1.2);
        }
    </style>
</head>

<body>

    <div class="container">

        <img src="https://picsum.photos/600/400">

    </div>

</body>
</html>
