<!DOCTYPE html>
<html>
<head>
    <title>Pulse Button</title>

    <style>
        body {
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        button {
            padding: 20px 40px;
            border: none;
            border-radius: 30px;

            background: blue;
            color: white;

            font-size: 20px;

            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {

            0% {
                transform: scale(1);
            }

            50% {
                transform: scale(1.1);
            }

            100% {
                transform: scale(1);
            }
        }
    </style>
</head>

<body>

    <button>
        Click Me
    </button>

</body>
</html>
