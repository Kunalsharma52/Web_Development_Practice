<!DOCTYPE html>
<html>
<head>
    <title>Bounce Animation</title>

    <style>
        body {
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .ball {
            width: 70px;
            height: 70px;
            background: crimson;
            border-radius: 50%;

            animation: bounce 1s ease-in-out infinite;
        }

        @keyframes bounce {

            0%, 100% {
                transform: translateY(0);
            }

            50% {
                transform: translateY(-200px);
            }
        }
    </style>
</head>

<body>

    <div class="ball"></div>

</body>
</html>
