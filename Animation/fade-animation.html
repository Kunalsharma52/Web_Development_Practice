<!DOCTYPE html>
<html>
<head>
    <title>Fade Animation</title>

    <style>
        body {
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .text {
            font-size: 50px;

            animation: fade 2s ease-in-out infinite alternate;
        }

        @keyframes fade {

            from {
                opacity: 0;
            }

            to {
                opacity: 1;
            }
        }
    </style>
</head>

<body>

    <div class="text">
        Hello World
    </div>

</body>
</html>
