<!DOCTYPE html>
<html>
<head>
    <title>3D Flip Card</title>

    <style>
        body {
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #222;
        }

        .card {
            width: 250px;
            height: 300px;

            perspective: 1000px;
        }

        .inner {
            width: 100%;
            height: 100%;

            position: relative;

            transition: transform 0.8s;

            transform-style: preserve-3d;
        }

        .card:hover .inner {
            transform: rotateY(180deg);
        }

        .front,
        .back {
            position: absolute;

            width: 100%;
            height: 100%;

            backface-visibility: hidden;

            display: flex;
            justify-content: center;
            align-items: center;

            border-radius: 20px;

            font-size: 25px;
        }

        .front {
            background: royalblue;
            color: white;
        }

        .back {
            background: orange;
            color: white;

            transform: rotateY(180deg);
        }
    </style>
</head>

<body>

    <div class="card">

        <div class="inner">

            <div class="front">
                Front
            </div>

            <div class="back">
                Back
            </div>

        </div>

    </div>

</body>
</html>
