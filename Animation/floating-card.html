<!DOCTYPE html>
<html>
<head>
    <title>Floating Card</title>

    <style>
        body {
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #eee;
        }

        .card {
            width: 250px;
            height: 300px;

            background: white;

            border-radius: 20px;

            box-shadow: 0 20px 40px rgba(0,0,0,0.2);

            display: flex;
            justify-content: center;
            align-items: center;

            font-size: 30px;

            animation: float 3s ease-in-out infinite;
        }

        @keyframes float {

            0%, 100% {
                transform: translateY(0);
            }

            50% {
                transform: translateY(-25px);
            }
        }
    </style>
</head>

<body>

    <div class="card">
        Floating Card
    </div>

</body>
</html>
