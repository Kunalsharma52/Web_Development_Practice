<!DOCTYPE html>
<html>
<head>
    <title>Spinner</title>

    <style>
        body {
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .loader {
            width: 70px;
            height: 70px;

            border: 8px solid #ddd;
            border-top: 8px solid blue;

            border-radius: 100%;

            animation: spin 1s linear infinite;
        }

        @keyframes spin {

            from {
                transform: rotate(0deg);
            }

            to {
                transform: rotate(360deg);
            }
        }
    </style>
</head>

<body>

    <div class="loader"></div>

</body>
</html>
