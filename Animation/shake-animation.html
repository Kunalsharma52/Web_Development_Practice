<!DOCTYPE html>
<html>
<head>
    <title>Shake Animation</title>

    <style>
        body {
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        button {
            padding: 20px 40px;
            font-size: 20px;
            cursor: pointer;
        }

        button:hover {
            animation: shake 0.4s;
        }

        @keyframes shake {

            0% {
                transform: translateX(0);
            }

            25% {
                transform: translateX(-10px);
            }

            50% {
                transform: translateX(10px);
            }

            75% {
                transform: translateX(-10px);
            }

            100% {
                transform: translateX(0);
            }
        }
    </style>
</head>

<body>

    <button>
        Hover Me
    </button>

</body>
</html>
