<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Loading Animation</title>

    <style>
        body {
            margin: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #111;
        }

        .loader {
            display: flex;
            gap: 10px;
        }

        .dot {
            width: 20px;
            height: 20px;
            background: #00ffcc;
            border-radius: 50%;
            animation: loading 1s infinite alternate;
        }

        .dot:nth-child(2) {
            animation-delay: 0.2s;
        }

        .dot:nth-child(3) {
            animation-delay: 0.4s;
        }

        @keyframes loading {
            from {
                transform: translateY(0);
                opacity: 0.3;
            }

            to {
                transform: translateY(-30px);
                opacity: 1;
            }
        }
    </style>
</head>

<body>

    <div class="loader">
        <div class="dot"></div>
        <div class="dot"></div>
        <div class="dot"></div>
    </div>

</body>
</html>
