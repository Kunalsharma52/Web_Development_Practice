<!DOCTYPE html>
<html>
<head>
    <title>Typing Animation</title>

    <style>
        body {
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: black;
            color: white;
        }

        .text {
            font-size: 40px;

            width: 0;
            overflow: hidden;
            white-space: nowrap;

            border-right: 3px solid white;

            animation:
                typing 4s steps(20) infinite alternate,
                blink 0.7s infinite;
        }

        @keyframes typing {

            from {
                width: 0;
            }

            to {
                width: 500px;
            }
        }

        @keyframes blink {

            50% {
                border-color: transparent;
            }
        }
    </style>
</head>

<body>

    <div class="text">
        Welcome to My Website
    </div>

</body>
</html>
